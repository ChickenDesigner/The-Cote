<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Cote — sprite gallery</title>
<link rel="stylesheet" href="css/style.css">
<style>
  #app { max-width: 1400px; }
  .gal-head { margin-bottom: 26px; }
  .gal-sec { margin-bottom: 34px; }
  .gal-sec > h2 { border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 6px; }
  .gal-sec > .sub { color: var(--ink-dim); font-size: .9rem; margin-bottom: 16px; }

  .gal-table { display: grid; gap: 10px; align-items: stretch; }
  .gal-corner { }
  .gal-colhead, .gal-rowhead {
    display: flex; align-items: center;
    font-size: .74rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--ink-faint); font-weight: 700;
  }
  .gal-colhead { justify-content: center; padding-bottom: 2px; }
  .gal-rowhead { justify-content: flex-end; text-align: right; padding-right: 6px; }

  .tile {
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 8px 9px; text-align: center;
  }
  .tile .art { display: flex; align-items: center; justify-content: center; min-height: 120px; }
  .tile .nm { font-size: .84rem; font-weight: 650; margin-top: 4px; }
  .tile .key {
    font-family: ui-monospace, Consolas, monospace; font-size: .68rem;
    color: var(--accent-2); opacity: .8; margin-top: 2px; word-break: break-all;
  }
  .tile.hl { border-color: var(--accent); }

  .gal-flow { display: flex; flex-wrap: wrap; gap: 10px; }
  .gal-flow .tile { width: 178px; }

  .legend { font-size: .85rem; color: var(--ink-dim); }
  .legend code { color: var(--accent-2); }
</style>
</head>
<body>
<div id="app">

  <header id="topbar" style="margin-bottom:18px">
    <div class="brand"><span class="brand-mark">🕊</span><span>Sprite Gallery</span></div>
    <div class="meters"><div class="meter"><div class="meter-sub">
      Every phenotype the built-in renderer can produce. Filenames shown are what to
      call a GIF in <code>assets/pigeons/</code> to override that tile.
    </div></div></div>
  </header>

  <nav id="nav" style="margin-bottom:24px">
    <a class="btn ghost" href="index.html" style="text-decoration:none">← Back to the game</a>
  </nav>

  <main id="gal"></main>

  <footer id="foot">
    <span>Rendered live by <code>js/sprites.js</code> — identical to the in-game art.</span>
    <span id="count"></span>
  </footer>
</div>

<script src="js/names.js"></script>
<script src="js/genetics.js"></script>
<script src="js/sprites.js"></script>
<script>
(function () {
  'use strict';

  var PATTERNS = [['c+', 'Bar'], ['C', 'Check'], ['CT', 'T-Check'], ['cb', 'Barless']];
  var DILS     = [['D+', 'Intense'], ['dP', 'Pale'], ['d', 'Dilute']];
  var BASES    = [['B+', 'Blue'], ['BA', 'Ash-Red'], ['b', 'Brown']];

  var gal = document.getElementById('gal');
  var total = 0;

  function genes(o) {
    return {
      base:    [o.base || 'B+',  o.base || 'B+'],
      dilute:  [o.dil  || 'D+',  o.dil  || 'D+'],
      spread:  o.spread ? ['S', 'S'] : ['s+', 's+'],
      pattern: [o.pat  || 'c+',  o.pat  || 'c+'],
      recred:  o.recred ? ['e', 'e'] : ['e+', 'e+'],
      eye:     o.pearl  ? ['tr', 'tr'] : ['Tr+', 'Tr+'],
      white:   o.white  ? ['zwh', 'zwh'] : ['z+', 'z+'],
      ts1: TS[o.ts || 'off'].ts1,
      ts2: TS[o.ts || 'off'].ts2,
      ts3: TS[o.ts || 'off'].ts3
    };
  }

  var TS = {
    off:     { ts1: ['ts1+', 'ts1+'], ts2: ['ts2+', 'ts2+'], ts3: ['Ts3+', 'Ts3+'] },
    bronze:  { ts1: ['Ts1', 'Ts1'],   ts2: ['Ts2', 'Ts2'],   ts3: ['Ts3+', 'Ts3+'] },
    partial: { ts1: ['Ts1', 'Ts1'],   ts2: ['Ts2', 'ts2+'],  ts3: ['ts3', 'ts3'] },
    full:    { ts1: ['Ts1', 'Ts1'],   ts2: ['Ts2', 'Ts2'],   ts3: ['ts3', 'ts3'] }
  };

  function tile(g, seedName) {
    var ph = Genetics.phenotype(g);
    var isSquab = !!seedName;
    var d = document.createElement('div');
    d.className = 'tile';
    var art = document.createElement('div');
    art.className = 'art';
    Sprites.mount(art, { id: seedName || ('g' + total), name: 'x', genes: g, stage: isSquab ? 'squab' : 'adult' }, 128);
    d.appendChild(art);
    var nm = document.createElement('div');
    nm.className = 'nm';
    nm.textContent = isSquab ? 'Squab (all colours)' : ph.name;
    d.appendChild(nm);
    var k = document.createElement('div');
    k.className = 'key';
    k.textContent = (isSquab ? 'squab' : Genetics.spriteKey(ph)) + '.gif';
    d.appendChild(k);
    total++;
    return d;
  }

  function section(title, sub) {
    var s = document.createElement('section');
    s.className = 'gal-sec';
    var h = document.createElement('h2'); h.textContent = title; s.appendChild(h);
    if (sub) { var p = document.createElement('p'); p.className = 'sub'; p.textContent = sub; s.appendChild(p); }
    gal.appendChild(s);
    return s;
  }

  function grid(cols) {
    var g = document.createElement('div');
    g.className = 'gal-table';
    g.style.gridTemplateColumns = '92px repeat(' + cols + ', minmax(0, 1fr))';
    return g;
  }

  function colHead(text) { var e = document.createElement('div'); e.className = 'gal-colhead'; e.textContent = text; return e; }
  function rowHead(text) { var e = document.createElement('div'); e.className = 'gal-rowhead'; e.textContent = text; return e; }
  function corner()      { var e = document.createElement('div'); e.className = 'gal-corner'; return e; }

  /* ---- 1-3: the three base colours, patterned ---- */

  BASES.forEach(function (b) {
    var s = section(b[1] + ' series', 'Wing pattern across the top, dilution down the side. ' +
      (b[0] === 'b' ? 'Brown has no dedicated GIF yet, so these tiles fall back to the ash-red art if you supply one.' : ''));
    var g = grid(PATTERNS.length);
    g.appendChild(corner());
    PATTERNS.forEach(function (p) { g.appendChild(colHead(p[1])); });
    DILS.forEach(function (d) {
      g.appendChild(rowHead(d[1]));
      PATTERNS.forEach(function (p) {
        g.appendChild(tile(genes({ base: b[0], dil: d[0], pat: p[0] })));
      });
    });
    s.appendChild(g);
  });

  /* ---- 4: spread ---- */

  var sp = section('Spread (self-coloured)',
    'Spread smears the tail-bar pigment over the whole bird, so the wing pattern vanishes — it is still in the genotype.');
  var gs = grid(BASES.length);
  gs.appendChild(corner());
  BASES.forEach(function (b) { gs.appendChild(colHead(b[1])); });
  DILS.forEach(function (d) {
    gs.appendChild(rowHead(d[1]));
    BASES.forEach(function (b) {
      gs.appendChild(tile(genes({ base: b[0], dil: d[0], spread: true })));
    });
  });
  sp.appendChild(gs);

  /* ---- 5: recessive red ---- */

  var rr = section('Recessive red (e//e)',
    'Epistatic to base colour and pattern — every feather goes to phaeomelanin. Only dilution still shows through.');
  var gr = document.createElement('div'); gr.className = 'gal-flow';
  DILS.forEach(function (d) { gr.appendChild(tile(genes({ dil: d[0], recred: true }))); });
  rr.appendChild(gr);

  /* ---- 6: recessive white ---- */

  var rw = section('Recessive white (zwh//zwh)',
    'Epistatic to everything, and the only phenotype with a bull (dark) eye. One tile, because every genotype underneath looks the same.');
  var gw = document.createElement('div'); gw.className = 'gal-flow';
  var wt = tile(genes({ base: 'BA', dil: 'd', pat: 'CT', white: true })); wt.classList.add('hl');
  gw.appendChild(wt);
  rw.appendChild(gw);

  /* ---- 7: toy stencil ---- */

  var TS_BASES = [
    ['Blue Bar',      { pat: 'c+' }],
    ['Blue T-Check',  { pat: 'CT' }],
    ['Black (spread)',{ pat: 'c+', spread: true }],
    ['Recessive Red', { pat: 'C', recred: true }]
  ];
  var TS_TIERS = [
    ['Bronze only', 'bronze',  'Ts1 · Ts2 · no whitener'],
    ['Partial',     'partial', 'Ts1 · one Ts2 · ts3//ts3'],
    ['Full white',  'full',    'Ts1 · Ts2//Ts2 · ts3//ts3']
  ];

  var ts = section('Toy stencil',
    'Three factors that only work together. Ts1 bronzes the wing markings. Ts2 lightens them, and takes ' +
    'two copies to do it fully. ts3//ts3 is the whitener. With all three the markings come out white; with ' +
    'a single copy of Ts2 they stop at cream; with no whitener you get bronze only. It works off the pattern ' +
    'gene rather than what you can see, so it still shows on spread and recessive red birds that would ' +
    'otherwise hide the pattern completely.');
  var gts = grid(TS_BASES.length);
  gts.appendChild(corner());
  TS_BASES.forEach(function (b) { gts.appendChild(colHead(b[0])); });
  TS_TIERS.forEach(function (t) {
    gts.appendChild(rowHead(t[0]));
    TS_BASES.forEach(function (b) {
      var o = {};
      for (var k in b[1]) o[k] = b[1][k];
      o.ts = t[1];
      var tl = tile(genes(o));
      tl.querySelector('.key').textContent = t[2];
      gts.appendChild(tl);
    });
  });
  ts.appendChild(gts);

  /* ---- 8: eye colour ---- */

  var ec = section('Eye colour',
    'Orange is the wild type. Pearl is recessive at the Tr locus (a nonsense mutation in SLC2A11B). ' +
    'Bull is not a Tr allele — it arrives with recessive white and overrides whatever is carried here. ' +
    'Eye colour is not part of the sprite filename, so a supplied GIF keeps its own eye.');
  var ge = document.createElement('div'); ge.className = 'gal-flow';
  [
    [genes({}), 'Orange eye', 'Tr+ // Tr+'],
    [genes({ pearl: true }), 'Pearl eye', 'tr // tr'],
    [genes({ white: true }), 'Bull eye', 'comes with zwh // zwh']
  ].forEach(function (row) {
    var t = tile(row[0]);
    t.querySelector('.nm').textContent = row[1];
    t.querySelector('.key').textContent = row[2];
    ge.appendChild(t);
  });
  ec.appendChild(ge);

  /* ---- 8: squabs ---- */

  var sq = section('Squabs',
    'Every squab looks the same, whatever it is going to grow into — nestlings are in down, not feather, so there is nothing to see yet. One sprite covers all of them.');
  var gq = document.createElement('div'); gq.className = 'gal-flow';
  var sqt = tile(genes({ base: 'B+', dil: 'D+' }), 'squab');
  sqt.classList.add('hl');
  gq.appendChild(sqt);
  sq.appendChild(gq);

  document.getElementById('count').textContent = total + ' variants';
  Sprites.setOnLoad(function () {});
})();
</script>
</body>
</html>
